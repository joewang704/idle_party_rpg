<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Little Party RPG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">A tiny idle RPG</p>
      <h1>Oaken</h1>
    </div>
    <div class="top-stats">
      <div><span class="muted">Gold</span><strong id="goldValue">0</strong></div>
      <div>
        <span class="muted">Party level</span>
        <strong id="partyLevel">1</strong>
      </div>
    </div>
    <div id="partyXpBar" class="party-xp-bar" role="progressbar" aria-label="Party experience" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0">
      <div id="partyXpFill" class="party-xp-fill"></div>
    </div>
  </header>
  <div class="party-xp-caption"><span id="partyXpText" class="party-xp-text">0 / 8 XP</span></div>

  <main class="layout">
    <section class="battle-panel panel">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Auto battle</p>
          <h2 id="enemyTitle">Green Slime · Lv. 1</h2>
        </div>
        <div class="battle-controls">
          <button id="pauseButton" class="secondary">Pause</button>
          <button id="fightButton">Fight now</button>
        </div>
      </div>
      <div class="arena-wrap">
        <canvas id="arena" width="900" height="340" aria-label="Party and enemy battle arena"></canvas>
        <div id="defeatOverlay" class="defeat-overlay" role="dialog" aria-modal="true" aria-labelledby="defeatTitle" hidden>
          <div class="defeat-content">
            <p class="eyebrow">Party defeated</p>
            <h2 id="defeatTitle">Your party has fallen</h2>
            <button id="retryButton" type="button">Retry fight</button>
          </div>
        </div>
      </div>
      <div class="battle-log">
        <div class="section-heading">
          <div><p class="eyebrow">Battle record</p></div>
          <div class="log-controls">
            <label class="check-label"><input type="checkbox" id="autoScroll" checked> Follow latest</label>
            <button id="clearLogButton" class="secondary small-button">Clear</button>
          </div>
        </div>
        <div id="combatLog" class="combat-log" role="log" aria-live="polite"></div>
      </div>
      <div class="recent-drops">
        <div class="section-heading">
          <div><h3>Recent drops</h3></div>
        </div>
        <div id="recentDropsList" class="recent-drops-list"></div>
      </div>
    </section>

    <section class="panel enemy-panel">
      <div class="section-heading">
        <div><p class="eyebrow">Hunting grounds</p><h2>Choose an enemy</h2></div>
      </div>
      <div id="enemyChoices" class="enemy-choices"></div>
    </section>

    <section class="panel party-panel">
      <div class="section-heading">
        <div><h2>Party</h2></div>
      </div>
      <div id="partyCards" class="party-cards"></div>
    </section>

    <section class="panel equipment-panel">
      <div class="section-heading">
        <div><h2>Equipment</h2></div>
      </div>
      <div class="equipment-layout">
        <div id="characterTabs" class="character-tabs"></div>
        <div class="equipment-main">
          <div id="equipmentSlots" class="equipment-slots"></div>
          <div class="inventory-heading" id="inventoryHeading">
            <h3>Inventory</h3>
            <span class="muted small" id="inventoryCount">0 items</span>
          </div>
          <div id="inventoryList" class="inventory-list"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>Prototype build · Plain HTML, CSS, JavaScript and Canvas · No libraries</footer>
  <script src="game.js"></script>
</body>
</html>
